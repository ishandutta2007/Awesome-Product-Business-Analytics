<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>

    <!-- Accent linear gradient for title and borders -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>

    <!-- Filter for soft neon glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 45px; y: 245px; }
        50% { height: 75px; y: 215px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 80px; y: 210px; }
        50% { height: 50px; y: 240px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 60px; y: 230px; }
        50% { height: 95px; y: 195px; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .anim-float { animation: floatSlow 6s ease-in-out infinite; }
      .anim-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .anim-bar-1 { animation: barGrow1 4s ease-in-out infinite; }
      .anim-bar-2 { animation: barGrow2 5s ease-in-out infinite 0.5s; }
      .anim-bar-3 { animation: barGrow3 4.5s ease-in-out infinite 1s; }
      .anim-dash { stroke-dasharray: 6 6; animation: dashFlow 2s linear infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#tech-grid)"/>

  <!-- Background Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#neon-glow)" class="anim-glow"/>
  <circle cx="1080" cy="240" r="140" fill="#818cf8" opacity="0.12" filter="url(#neon-glow)" class="anim-glow"/>
  <circle cx="920" cy="70" r="90" fill="#c084fc" opacity="0.10" filter="url(#neon-glow)"/>

  <!-- Background Subtle Analytics Wave / Graph Elements (Kept in Background) -->
  <g opacity="0.45">
    <!-- Connecting Dashed Curves -->
    <path d="M 50 270 Q 250 220, 450 250 T 850 210 T 1150 240" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-dash" opacity="0.4"/>
    <path d="M 50 290 Q 300 240, 600 280 T 1150 260" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Subtle Dynamic Chart Bars on Right Side Background -->
    <g transform="translate(870, 0)">
      <rect x="0" y="240" width="22" height="50" rx="4" fill="url(#accent-cyan)" class="anim-bar-1"/>
      <rect x="32" y="210" width="22" height="80" rx="4" fill="url(#accent-purple)" class="anim-bar-2"/>
      <rect x="64" y="225" width="22" height="65" rx="4" fill="url(#accent-emerald)" class="anim-bar-3"/>
      <rect x="96" y="195" width="22" height="95" rx="4" fill="url(#accent-cyan)" class="anim-bar-2"/>
      <rect x="128" y="235" width="22" height="55" rx="4" fill="url(#accent-purple)" class="anim-bar-1"/>
      <rect x="160" y="180" width="22" height="110" rx="4" fill="url(#accent-emerald)" class="anim-bar-3"/>
      <!-- Chart Baseline -->
      <line x1="-15" y1="295" x2="200" y2="295" stroke="#475569" stroke-width="1" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- Foreground Divider Glow Line -->
  <line x1="80" y1="315" x2="1120" y2="315" stroke="url(#glow-line)" stroke-width="2"/>

  <!-- Main Foreground Content Area (Guaranteed Foreground & Sharp Contrast) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill Badges -->
    <g transform="translate(0, 48)">
      <!-- Badge 1: Product & Growth -->
      <rect x="0" y="0" width="175" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="19" fill="#e2e8f0" class="tag-text">PRODUCT ANALYTICS</text>

      <!-- Badge 2: Business Intelligence -->
      <rect x="190" y="0" width="195" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="206" cy="15" r="4" fill="#818cf8"/>
      <text x="218" y="19" fill="#e2e8f0" class="tag-text">BUSINESS INTELLIGENCE</text>

      <!-- Badge 3: Open Source -->
      <rect x="400" y="0" width="155" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="416" cy="15" r="4" fill="#34d399"/>
      <text x="428" y="19" fill="#e2e8f0" class="tag-text">OPEN SOURCE &amp; SAAS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="url(#title-grad)" class="title-text">
      Awesome Product &amp; Business Analytics
    </text>

    <!-- Subtitle (Two Lines for Readability & Clean Layout) -->
    <text x="0" y="178" class="subtitle-text">
      Curated ecosystem of SaaS &amp; open-source platforms for event streaming, behavioral cohorts,
    </text>
    <text x="0" y="206" class="subtitle-text">
      conversion funnels, enterprise BI dashboards, session replays, and governed semantic data layers.
    </text>

    <!-- Stat Highlights / Key Capabilities (Foreground Pills) -->
    <g transform="translate(0, 240)" class="anim-float">
      <!-- Feature Point 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#f8fafc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">📊 Funnels &amp; Retention</text>
      </g>

      <!-- Feature Point 2 -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#f8fafc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">📈 Enterprise Dashboards</text>
      </g>

      <!-- Feature Point 3 -->
      <g transform="translate(370, 0)">
        <rect x="0" y="0" width="165" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#f8fafc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">⚡ Event Data Pipelines</text>
      </g>

      <!-- Feature Point 4 -->
      <g transform="translate(550, 0)">
        <rect x="0" y="0" width="160" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
        <text x="14" y="26" fill="#f8fafc" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">🔒 Privacy &amp; Self-Host</text>
      </g>
    </g>

  </g>

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>
</svg>
